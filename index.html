<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Exam Behaviour Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark top-nav">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <div class="brand-mark">AI</div>
          <div class="brand-text ms-2">
            <div class="h6 mb-0">AI Exam Behaviour Detection</div>
            <small class="text-muted">Real-time proctoring demo</small>
          </div>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#features">Features</a></li>
            <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="d-flex align-items-center justify-content-center min-vh-100">
      <div class="glass-card container-lg">
        <div class="row gy-4">
          <div class="col-12 col-lg-7">
            <div class="card webcam-card shadow-sm">
              <div class="card-body p-3 d-flex flex-column gap-3">
                <div class="d-flex justify-content-between align-items-center">
                  <h5 class="card-title mb-0">Live Camera</h5>
                  <div id="status" class="text-muted small">Idle</div>
                </div>
                <div id="webcam-container" class="rounded-4 overflow-hidden mx-auto webcam-wrap"></div>
                <div class="d-flex gap-2 justify-content-end">
                  <input id="model-url" class="form-control form-control-sm" style="max-width:460px;" value="https://teachablemachine.withgoogle.com/models/vx6NXM9Sm/">
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-5">
            <div class="card controls-card p-3 shadow-sm">
              <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="mb-0">Predictions</h5>
                <div>
                  <button id="start-btn" class="btn btn-gradient me-2"><i class="fa-solid fa-play me-1"></i>Start</button>
                  <button id="stop-btn" class="btn btn-outline-light" disabled><i class="fa-solid fa-square-stop me-1"></i>Stop</button>
                </div>
              </div>

              <div id="label-container" class="mb-3"></div>

              <div class="stats-grid d-grid gap-3">
                <div class="stat-card p-3 rounded-4 shadow-sm d-flex justify-content-between align-items-center">
                  <div>
                    <div class="text-muted small">Focus Percentage</div>
                    <div id="focus-percent" class="h4 mb-0">0%</div>
                  </div>
                  <div style="width:60%">
                    <div class="progress progress-sm bg-soft">
                      <div id="focus-bar" class="progress-bar bg-success" role="progressbar" style="width:0%" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                  </div>
                </div>

                <div class="stat-card p-3 rounded-4 shadow-sm d-flex justify-content-between align-items-center">
                  <div>
                    <div class="text-muted small">Distracted Percentage</div>
                    <div id="distracted-percent" class="h4 mb-0">0%</div>
                  </div>
                  <div style="width:60%">
                    <div class="progress progress-sm bg-soft">
                      <div id="distracted-bar" class="progress-bar bg-warning" role="progressbar" style="width:0%" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                  </div>
                </div>

                <div class="stat-card p-3 rounded-4 shadow-sm d-flex justify-content-between align-items-center">
                  <div>
                    <div class="text-muted small">Away Percentage</div>
                    <div id="away-percent" class="h4 mb-0">0%</div>
                  </div>
                  <div style="width:60%">
                    <div class="progress progress-sm bg-soft">
                      <div id="away-bar" class="progress-bar bg-danger" role="progressbar" style="width:0%" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <section id="features" class="mt-4">
          <div class="text-center text-muted small">Features: Real-time predictions, summary statistics, responsive UI.</div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container d-flex justify-content-between align-items-center py-3">
        <div>
          <div>Developed by <strong>Jopriya Johny</strong></div>
          <div class="text-muted small">B.Tech IT Student</div>
        </div>
        <div class="socials">
          <a href="#" class="text-muted me-3"><i class="fa-brands fa-github fa-lg"></i></a>
          <a href="#" class="text-muted"><i class="fa-brands fa-linkedin fa-lg"></i></a>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
